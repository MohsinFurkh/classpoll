<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>Join a poll</title>
<link rel="stylesheet" href="/assets/app.css">
<link rel="icon" href="data:,">
</head>
<body>
<main class="shell center">
  <h1>Join the poll</h1>
  <p class="muted">Enter the 4-letter code on the screen.</p>

  <form id="joinForm" autocomplete="off">
    <div class="field">
      <input id="code" class="code-input" maxlength="4" inputmode="text"
             autocapitalize="characters" spellcheck="false" aria-label="Poll code" required>
    </div>
    <button class="primary" style="width:100%;font-size:1.1rem;padding:1rem">Join</button>
  </form>

  <p class="muted" style="margin-top:2.5rem;font-size:.85rem">
    Teacher? <a href="/host" style="color:var(--accent)">Open the console</a>
  </p>
</main>

<script>
  const input = document.getElementById('code');
  input.focus();
  input.addEventListener('input', () => {
    input.value = input.value.toUpperCase().replace(/[^A-Z]/g, '');
    if (input.value.length === 4) document.getElementById('joinForm').requestSubmit();
  });
  document.getElementById('joinForm').addEventListener('submit', (e) => {
    e.preventDefault();
    if (input.value.length === 4) location.href = '/' + input.value;
  });
</script>
</body>
</html>
