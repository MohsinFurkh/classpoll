<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0d1117">
<title>Vote</title>
<link rel="stylesheet" href="/assets/app.css">
<link rel="icon" href="data:,">
</head>
<body>
<main class="vote-wrap">
  <div class="row" style="justify-content:space-between;margin-bottom:1.2rem">
    <span class="pill" id="status">connecting</span>
    <span class="muted" style="font-size:.8rem;letter-spacing:.2em" id="codeTag"></span>
  </div>

  <div id="waiting" class="center" style="padding:4rem 0">
    <h2 class="muted">Waiting for the teacher…</h2>
    <p class="muted">Keep this page open.</p>
  </div>

  <div id="live" class="hidden">
    <div class="question" id="question"></div>

    <div id="choiceUI" class="options hidden"></div>

    <form id="multiUI" class="hidden" autocomplete="off">
      <div id="parts"></div>
      <div class="multi-send">
        <span class="muted" id="multiProgress"></span>
        <button class="primary" style="flex:1;font-size:1.05rem;padding:.95rem">Send answers</button>
      </div>
    </form>

    <form id="textUI" class="hidden" autocomplete="off">
      <div class="field">
        <input id="answer" maxlength="140" placeholder="Type your answer" aria-label="Your answer">
        <p class="muted" id="hint" style="font-size:.8rem;margin:.5rem 0 0"></p>
      </div>
      <button class="primary" style="width:100%;font-size:1.05rem;padding:.95rem">Send</button>
    </form>

    <div id="confirm" class="confirm hidden"></div>
    <div id="results" class="hidden" style="margin-top:1.5rem"></div>
  </div>
</main>

<script src="/assets/vote.js"></script>
</body>
</html>
